<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5eff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meu Treino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de celular, conteúdo rolando, barra de abas fixa embaixo */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#14202e; --muted:#5d6b7c; --line:#d9dfe7;
  --accent:#1f5eff; --accent-ink:#ffffff; --good:#0f9d6b; --warn:#c2410c; --chip:#e4e9f0;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --card:#17212e; --ink:#e8eef6; --muted:#93a1b3; --line:#27344a;
  --accent:#5b8cff; --accent-ink:#0b1220; --good:#34d399; --warn:#fb923c; --chip:#223049; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --card:#17212e; --ink:#e8eef6; --muted:#93a1b3; --line:#27344a;
  --accent:#5b8cff; --accent-ink:#0b1220; --good:#34d399; --warn:#fb923c; --chip:#223049; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0}
#app{max-width:560px;margin:0 auto;padding-block:16px 96px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:30px}
h2{font-size:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.datebar input{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);padding:6px 10px;min-height:36px}
.btn.sq{width:44px;padding:0}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sets{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.sets li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 6px 6px 12px}
.sets .n{font-family:var(--display);font-size:18px;color:var(--muted);width:22px}
.sets .v{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.add label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.add .go{align-self:end}
.hint{font-size:13px;color:var(--muted)}
.done{color:var(--good);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{flex:1;background:none;border:0;padding:8px 2px;border-radius:10px;font-family:var(--display);font-size:17px;letter-spacing:.03em;color:var(--muted);min-height:44px}
.tabs button[aria-current="true"]{color:var(--accent);background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.hist-day{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hist-day ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.exrow{display:flex;gap:8px;align-items:center}
.exrow input{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:9}
.srow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 12px}
.srow.ok{background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.srow .n{font-family:var(--display);font-size:20px;width:18px;color:var(--muted)}
.vals{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.pill{background:var(--chip);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.circ{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--accent);background:none;color:var(--accent-ink);font-size:20px;font-weight:700;flex:none;padding:0}
.circ[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.ico{background:none;border:0;color:var(--muted);font-size:18px;width:36px;height:40px;flex:none;padding:0}
.srow.editing{flex-wrap:wrap}
.ed{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-width:0}
.ed label,.cfg label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.ed input{padding:8px;min-height:40px}
.cardfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cardfoot .btn{padding:8px 12px;min-height:40px}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.rest{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;z-index:8;font-variant-numeric:tabular-nums}
.rest span{min-width:0}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden></div>
<div class="rest" id="rest" hidden><span></span><button class="btn ghost" data-a="pular">Pular</button></div>

<script>
(function(){
"use strict";
var KEY="meu-treino-v1";
var DIAS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var DIAS_C=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function uid(){return Math.random().toString(36).slice(2,9)}

// ---------- dados ----------
function padrao(){
  var ex=[],plan={1:[],2:[],3:[],4:[],5:[]};
  function e(nome,dias){var id=uid();ex.push({id:id,nome:nome,series:3,reps:12,carga:0,desc:60});dias.forEach(function(d){plan[d].push(id)});}
  e("Supino reto",[1]);e("Crucifixo",[1]);e("Desenvolvimento de ombro",[1]);e("Elevação lateral",[1]);
  e("Tríceps testa",[1]);e("Tríceps corda",[1]);
  e("Puxada vertical",[2]);e("Remada horizontal 1",[2]);e("Remada horizontal 2",[2]);
  e("Posterior de ombro",[2]);e("Rosca direta",[2]);e("Rosca martelo",[2]);
  e("Agachamento",[3]);e("Leg press pé baixo",[3]);e("Cadeira extensora",[3]);
  e("Posterior / glúteo",[3]);e("Panturrilha",[3]);
  e("Supino inclinado",[4]);e("Peito na máquina",[4]);e("Puxada frontal",[4]);e("Remada baixa",[4]);
  e("Desenvolvimento com halter",[4]);e("Elevação frontal",[4]);e("Rosca alternada",[4]);e("Tríceps francês",[4]);
  e("Mesa flexora",[5]);e("Agachamento búlgaro",[5]);e("Glúteo na polia",[5]);e("Cadeira adutora",[5]);
  e("Panturrilha em pé",[5]);e("Panturrilha sentado",[5]);
  return {ex:ex,plan:plan,logs:[]};
}
var memoria=null;
function carregar(){
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.ex&&d.plan&&d.logs){d.ex.forEach(function(e){if(e.series==null)e.series=3;if(e.reps==null)e.reps=12;if(e.carga==null)e.carga=0;if(e.desc==null)e.desc=60});return d;}}}catch(e){}
  return memoria||padrao();
}
var S=carregar();
function salvar(){memoria=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ---------- utilidades ----------
function hoje(){var d=new Date();return fmt(d)}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function somaDia(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function bonito(s){var d=parse(s);return DIAS_C[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){return String(v).replace(".",",")}
function nomeEx(id){var e=S.ex.find(function(x){return x.id===id});return e?e.nome:"(removido)"}
function logDe(data,exId){return S.logs.find(function(l){return l.data===data&&l.ex===exId})}
function F(l){return l.series.filter(Boolean)}
function sessoes(exId){return S.logs.filter(function(l){return l.ex===exId&&F(l).length}).sort(function(a,b){return a.data<b.data?-1:1})}
function ultima(exId,antesDe){var s=sessoes(exId).filter(function(l){return l.data<antesDe});return s.length?s[s.length-1]:null}
function resumo(series){return series.filter(Boolean).map(function(s){return s.reps+"×"+num(s.carga)}).join(" · ")}
function maxCarga(l){return Math.max.apply(null,F(l).map(function(s){return s.carga}))}
function volume(l){return F(l).reduce(function(a,s){return a+s.reps*s.carga},0)}
var ac=null;
function audio(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==="suspended")ac.resume()}catch(e){}}
function bip(){if(S.som===false)return;audio();if(!ac)return;try{[0,0.3,0.6].forEach(function(t,i){var o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+t;o.type="sine";o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(0.5,T+0.02);g.gain.exponentialRampToValueAtTime(0.0001,T+0.24);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+0.26)})}catch(e){}}
var tmr;function aviso(t){var el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tmr);tmr=setTimeout(function(){el.hidden=true},1800)}

// ---------- estado de tela ----------
var U={aba:"treinar",data:hoje(),prog:null,metrica:"carga",extra:{},rasc:{},edit:null,timer:null};
var app=document.getElementById("app");

function exerciciosDoDia(data){
  var dow=parse(data).getDay();
  var ids=(S.plan[dow]||[]).slice();
  S.logs.forEach(function(l){if(l.data===data&&F(l).length&&ids.indexOf(l.ex)<0)ids.push(l.ex)});
  (U.extra[data]||[]).forEach(function(i){if(ids.indexOf(i)<0)ids.push(i)});
  return ids.filter(function(i){return S.ex.some(function(e){return e.id===i})});
}

// ---------- telas ----------
function exDe(id){return S.ex.find(function(x){return x.id===id})}
function nSeries(id){var l=logDe(U.data,id),e=exDe(id);return Math.max(l&&l.n?l.n:e.series,l?l.series.length:0)}
function valores(id,i){
  var e=exDe(id),l=logDe(U.data,id),k=U.data+"|"+id+"|"+i;
  if(l&&l.series[i])return l.series[i];
  if(U.rasc[k])return U.rasc[k];
  var u=ultima(id,U.data);
  if(u){var d=F(u),x=u.series[i]||d[d.length-1];return{reps:x.reps,carga:x.carga,desc:x.desc!=null?x.desc:e.desc}}
  return{reps:e.reps,carga:e.carga,desc:e.desc};
}
function anel(p){var c=2*Math.PI*18;return'<svg width="52" height="52" viewBox="0 0 44 44" aria-label="'+Math.round(p*100)+'% concluído"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--chip)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--ink)">'+Math.round(p*100)+'%</text></svg>'}
function telaTreinar(){
  var dow=parse(U.data).getDay(), ids=exerciciosDoDia(U.data), h="";
  var feitos=ids.filter(function(i){var l=logDe(U.data,i);return l&&F(l).length>=nSeries(i)}).length;
  h+='<div class="top"><h1>'+DIAS[dow]+'</h1><span class="muted">'+(ids.length?feitos+" de "+ids.length+" completos":"")+'</span></div>';
  h+='<div class="datebar"><button class="btn ghost sq" data-a="dia" data-n="-1" aria-label="Dia anterior">‹</button>'+
     '<input type="date" id="data" value="'+U.data+'" aria-label="Data do treino"><button class="btn ghost sq" data-a="dia" data-n="1" aria-label="Próximo dia">›</button>'+
     (U.data!==hoje()?'<button class="btn ghost" data-a="hoje">Hoje</button>':'')+'</div>';
  if(!ids.length)h+='<div class="empty card">Dia livre. Adicione um exercício abaixo se for treinar.</div>';
  ids.forEach(function(id){
    var l=logDe(U.data,id), n=nSeries(id), fe=l?F(l).length:0, ult=ultima(id,U.data);
    h+='<section class="card"><div class="card-h" style="align-items:center"><div style="min-width:0"><h2>'+esc(nomeEx(id))+'</h2><div class="hint">'+(ult?"Última vez ("+bonito(ult.data)+"): "+esc(resumo(ult.series)):"Primeira vez registrando")+'</div></div>'+anel(n?fe/n:0)+'</div><div class="sets">';
    for(var i=0;i<n;i++){
      var v=valores(id,i),ok=!!(l&&l.series[i]),k=U.data+"|"+id+"|"+i;
      if(U.edit===k){
        h+='<div class="srow editing"><span class="n">'+(i+1)+'</span><div class="ed"><div><label for="e-r">Reps</label><input id="e-r" type="number" inputmode="numeric" min="1" value="'+v.reps+'"></div>'+
           '<div><label for="e-k">Peso (kg)</label><input id="e-k" type="number" inputmode="decimal" min="0" step="0.5" value="'+v.carga+'"></div>'+
           '<div><label for="e-d">Descanso (s)</label><input id="e-d" type="number" inputmode="numeric" min="0" step="5" value="'+v.desc+'"></div></div>'+
           '<button class="btn" data-a="saveedit" data-id="'+id+'" data-i="'+i+'">OK</button></div>';
      }else{
        h+='<div class="srow'+(ok?' ok':'')+'"><span class="n">'+(i+1)+'</span><div class="vals"><span class="pill">↻ '+v.reps+'</span><span class="pill">⚖ '+num(v.carga)+' kg</span><span class="pill">⏱ '+v.desc+' s</span></div>'+
           '<button class="ico" data-a="edit" data-k="'+k+'" aria-label="Editar série '+(i+1)+'">✎</button>'+
           '<button class="circ" data-a="toggle" data-id="'+id+'" data-i="'+i+'" aria-pressed="'+ok+'" aria-label="'+(ok?'Desfazer':'Concluir')+' série '+(i+1)+'">'+(ok?'✓':'')+'</button></div>';
      }
    }
    h+='</div><div class="cardfoot"><button class="btn ghost" data-a="menos" data-id="'+id+'" aria-label="Menos uma série">− série</button><button class="btn ghost" data-a="mais" data-id="'+id+'" aria-label="Mais uma série">+ série</button><button class="btn" data-a="todos" data-id="'+id+'" style="margin-left:auto">Concluir todos</button></div></section>';
  });
  var fora=S.ex.filter(function(e){return ids.indexOf(e.id)<0});
  if(fora.length){
    h+='<div class="card"><label class="small muted" for="extra">Adicionar outro exercício neste dia</label><div class="exrow" style="margin-top:6px">'+
       '<select id="extra">'+fora.map(function(e){return'<option value="'+e.id+'">'+esc(e.nome)+'</option>'}).join("")+'</select>'+
       '<button class="btn ghost" data-a="extra">Adicionar</button></div></div>';
  }
  return h;
}

function telaHistorico(){
  var datas={};S.logs.forEach(function(l){if(F(l).length)(datas[l.data]=datas[l.data]||[]).push(l)});
  var ks=Object.keys(datas).sort().reverse(), h='<div class="top"><h1>Histórico</h1><span class="muted">'+ks.length+' treinos</span></div>';
  if(!ks.length)return h+'<div class="empty card">Nenhum treino registrado ainda. Faça o primeiro na aba Treinar.</div>';
  ks.forEach(function(d){
    var ls=datas[d],tot=ls.reduce(function(a,l){return a+F(l).length},0);
    h+='<button class="hist-day" data-a="abrir" data-d="'+d+'"><div class="card-h"><h2>'+bonito(d)+'</h2><span class="muted small">'+ls.length+' exercícios · '+tot+' séries</span></div><ul>'+
      ls.map(function(l){return'<li>'+esc(nomeEx(l.ex))+': '+esc(resumo(l.series))+'</li>'}).join("")+'</ul></button>';
  });
  return h;
}

function grafico(pts,rotulo){
  var W=360,H=190,L=38,R=12,T=14,B=26;
  var ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mn===mx){mn=mn-1;mx=mx+1}
  var pad=(mx-mn)*0.15;mn=Math.max(0,mn-pad);mx=mx+pad;
  function X(i){return pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1)}
  function Y(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução: '+rotulo+'">';
  for(var g=0;g<4;g++){var v=mn+(mx-mn)*g/3,y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>'}
  var d=pts.map(function(p,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)}).join(" ");
  if(pts.length>1)s+='<path d="'+d+' L'+X(pts.length-1)+' '+(H-B)+' L'+X(0)+' '+(H-B)+'Z" fill="var(--accent)" opacity=".12"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="'+(i===pts.length-1?5:3)+'" fill="'+(i===pts.length-1?'var(--accent)':'var(--card)')+'" stroke="var(--accent)" stroke-width="2"/>'});
  var li=[0,pts.length-1].filter(function(v,i,a){return a.indexOf(v)===i});
  li.forEach(function(i){s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&pts.length>1?"start":(pts.length===1?"middle":"end"))+'">'+bonito(pts[i].d).slice(5)+'</text>'});
  return s+'</svg>';
}

function telaProgresso(){
  var com=S.ex.filter(function(e){return sessoes(e.id).length});
  var h='<div class="top"><h1>Progresso</h1></div>';
  if(!com.length)return h+'<div class="empty card">O gráfico aparece depois do primeiro treino registrado.</div>';
  if(!U.prog||!com.some(function(e){return e.id===U.prog}))U.prog=com[0].id;
  h+='<label class="small muted" for="progsel">Exercício</label><select id="progsel" style="margin-bottom:10px">'+
    com.map(function(e){return'<option value="'+e.id+'"'+(e.id===U.prog?' selected':'')+'>'+esc(e.nome)+'</option>'}).join("")+'</select>';
  var ss=sessoes(U.prog);
  var pts=ss.map(function(l){return{d:l.data,y:U.metrica==="carga"?maxCarga(l):volume(l)}});
  h+='<div class="chips" style="margin:0 0 10px"><button class="chip" data-a="metrica" data-m="carga" aria-pressed="'+(U.metrica==="carga")+'">Maior carga (kg)</button>'+
     '<button class="chip" data-a="metrica" data-m="volume" aria-pressed="'+(U.metrica==="volume")+'">Volume (reps × kg)</button></div>';
  var primeiro=pts[0].y,ultimo=pts[pts.length-1].y,melhor=Math.max.apply(null,pts.map(function(p){return p.y}));
  var dif=ultimo-primeiro;
  h+='<div class="stats"><div class="stat"><b>'+num(Math.round(ultimo*10)/10)+'</b><span>Último treino</span></div>'+
     '<div class="stat"><b>'+num(Math.round(melhor*10)/10)+'</b><span>Melhor marca</span></div>'+
     '<div class="stat"><b style="color:'+(dif>0?'var(--good)':dif<0?'var(--warn)':'inherit')+'">'+(dif>0?"+":"")+num(Math.round(dif*10)/10)+'</b><span>Desde o início</span></div></div>';
  h+='<div class="card">'+grafico(pts,nomeEx(U.prog))+'</div>';
  h+='<h2 style="margin:14px 0 8px">Sessões</h2>';
  ss.slice().reverse().forEach(function(l){h+='<div class="card" style="padding:10px 14px"><b>'+bonito(l.data)+'</b><div class="hint">'+esc(resumo(l.series))+'</div></div>'});
  return h;
}

function telaExercicios(){
  var h='<div class="top"><h1>Exercícios</h1></div>';
  h+='<div class="card"><label class="small muted" for="novo">Novo exercício</label><div class="exrow" style="margin-top:6px"><input id="novo" placeholder="Ex.: Rosca scott"><button class="btn" data-a="novoex">Criar</button></div></div>';
  S.ex.forEach(function(e){
    h+='<div class="card"><div class="exrow"><input data-a="renomear" data-id="'+e.id+'" value="'+esc(e.nome)+'" aria-label="Nome do exercício"><button class="btn danger" data-a="delex" data-id="'+e.id+'">Excluir</button></div>'+
       '<div class="cfg"><div><label for="s-'+e.id+'">Séries</label><input id="s-'+e.id+'" type="number" inputmode="numeric" min="1" data-a="cfg" data-f="series" data-id="'+e.id+'" value="'+e.series+'"></div>'+
       '<div><label for="p-'+e.id+'">Reps</label><input id="p-'+e.id+'" type="number" inputmode="numeric" min="1" data-a="cfg" data-f="reps" data-id="'+e.id+'" value="'+e.reps+'"></div>'+
       '<div><label for="d-'+e.id+'">Descanso (s)</label><input id="d-'+e.id+'" type="number" inputmode="numeric" min="0" step="5" data-a="cfg" data-f="desc" data-id="'+e.id+'" value="'+e.desc+'"></div></div>'+
       '<div class="chips">'+[1,2,3,4,5,6,0].map(function(d){var on=(S.plan[d]||[]).indexOf(e.id)>=0;
        return'<button class="chip" data-a="dia-plano" data-id="'+e.id+'" data-d="'+d+'" aria-pressed="'+on+'">'+DIAS_C[d]+'</button>'}).join("")+'</div></div>';
  });
  h+='<div class="card"><label class="exrow" for="som" style="cursor:pointer"><input id="som" type="checkbox" style="width:24px;min-height:24px;flex:none"'+(S.som===false?'':' checked')+'><span style="flex:1">Tocar som quando o descanso acabar</span></label></div>'+
     '<h2 style="margin:18px 0 8px">Backup</h2><div class="card"><p class="small muted" style="margin-top:0">Seus dados ficam só neste aparelho. Copie o texto abaixo e guarde (por exemplo, enviando para você mesmo) para não perder se limpar o navegador.</p>'+
     '<textarea id="bk" aria-label="Backup dos dados">'+esc(JSON.stringify(S))+'</textarea>'+
     '<div class="exrow" style="margin-top:8px"><button class="btn ghost" data-a="copiar">Copiar</button><button class="btn ghost" data-a="restaurar">Restaurar do texto</button></div></div>';
  return h;
}

var TABS=[["treinar","Treinar"],["historico","Histórico"],["progresso","Progresso"],["exercicios","Exercícios"]];
function render(){
  var scroll=window.scrollY;
  app.innerHTML={treinar:telaTreinar,historico:telaHistorico,progresso:telaProgresso,exercicios:telaExercicios}[U.aba]();
  document.getElementById("tabs").innerHTML=TABS.map(function(t){return'<button data-a="aba" data-t="'+t[0]+'" aria-current="'+(U.aba===t[0])+'">'+t[1]+'</button>'}).join("");
  window.scrollTo(0,scroll);
}

// ---------- ações ----------
function criarLog(data,ex){var l=logDe(data,ex);if(!l){l={data:data,ex:ex,series:[]};S.logs.push(l)}return l}
document.addEventListener("click",function(ev){
  audio();
  var b=ev.target.closest("[data-a]");if(!b||b.tagName==="INPUT")return;
  var a=b.dataset.a,id=b.dataset.id;
  if(a==="aba"){U.aba=b.dataset.t;window.scrollTo(0,0);render();return}
  if(a==="dia"){U.data=somaDia(U.data,+b.dataset.n)}
  else if(a==="hoje"){U.data=hoje()}
  else if(a==="abrir"){U.data=b.dataset.d;U.aba="treinar";window.scrollTo(0,0)}
  else if(a==="toggle"){var l=criarLog(U.data,id),i=+b.dataset.i;
    if(l.series[i]){l.series[i]=null}
    else{var v=valores(id,i);l.series[i]={reps:+v.reps,carga:+v.carga,desc:+v.desc};delete U.rasc[U.data+"|"+id+"|"+i];
      if(l.series[i].desc>0){U.timer={fim:Date.now()+l.series[i].desc*1000,nome:nomeEx(id)}}}
    for(var j=0;j<l.series.length;j++)if(l.series[j]===undefined)l.series[j]=null;salvar()}
  else if(a==="edit"){U.edit=b.dataset.k}
  else if(a==="saveedit"){var i2=+b.dataset.i,r=parseInt(document.getElementById("e-r").value,10),kg=parseFloat(String(document.getElementById("e-k").value).replace(",",".")),ds=parseInt(document.getElementById("e-d").value,10);
    if(!(r>0)||isNaN(kg)||kg<0||isNaN(ds)||ds<0){aviso("Confira os valores");return}
    var v2={reps:r,carga:kg,desc:ds},l2=logDe(U.data,id);
    if(l2&&l2.series[i2])l2.series[i2]=v2;else U.rasc[U.data+"|"+id+"|"+i2]=v2;
    // as séries seguintes ainda não feitas herdam o novo peso
    for(var q=i2+1;q<nSeries(id);q++){if(!(l2&&l2.series[q]))U.rasc[U.data+"|"+id+"|"+q]={reps:r,carga:kg,desc:ds}}
    U.edit=null;salvar()}
  else if(a==="todos"){var l3=criarLog(U.data,id),n3=nSeries(id);for(var z=0;z<n3;z++)if(!l3.series[z]){var v3=valores(id,z);l3.series[z]={reps:+v3.reps,carga:+v3.carga,desc:+v3.desc}}
    for(var j2=0;j2<l3.series.length;j2++)if(l3.series[j2]===undefined)l3.series[j2]=null;salvar();aviso("Todas concluídas")}
  else if(a==="mais"){var l4=criarLog(U.data,id);l4.n=nSeries(id)+1;salvar()}
  else if(a==="menos"){var l5=criarLog(U.data,id),n5=nSeries(id);if(n5<=1)return;l5.n=n5-1;l5.series.length=Math.min(l5.series.length,l5.n);salvar()}
  else if(a==="pular"){U.timer=null}
  else if(a==="extra"){var v=document.getElementById("extra").value;(U.extra[U.data]=U.extra[U.data]||[]).push(v)}
  else if(a==="metrica"){U.metrica=b.dataset.m}
  else if(a==="novoex"){var n=document.getElementById("novo").value.trim();if(!n){aviso("Digite o nome");return}S.ex.push({id:uid(),nome:n});salvar();aviso("Exercício criado")}
  else if(a==="delex"){
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Confirmar?";setTimeout(function(){if(b.isConnected){b.dataset.sure="";b.textContent="Excluir"}},3000);return}
    S.ex=S.ex.filter(function(e){return e.id!==id});S.logs=S.logs.filter(function(l){return l.ex!==id});
    Object.keys(S.plan).forEach(function(d){S.plan[d]=S.plan[d].filter(function(x){return x!==id})});salvar()}
  else if(a==="dia-plano"){var d=b.dataset.d,p=S.plan[d]=S.plan[d]||[],i=p.indexOf(id);if(i>=0)p.splice(i,1);else p.push(id);salvar()}
  else if(a==="copiar"){var t=document.getElementById("bk");t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(function(){aviso("Copiado")},function(){try{document.execCommand("copy");aviso("Copiado")}catch(e){aviso("Selecione e copie")}});return}
  else if(a==="restaurar"){try{var d2=JSON.parse(document.getElementById("bk").value);if(!d2.ex||!d2.plan||!d2.logs)throw 0;S=d2;salvar();aviso("Dados restaurados")}catch(e){aviso("Texto inválido");return}}
  render();
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="som"){S.som=t.checked;salvar();if(t.checked)bip()}
  else if(t.id==="data"&&t.value){U.data=t.value;render()}
  else if(t.id==="progsel"){U.prog=t.value;render()}
  else if(t.dataset&&t.dataset.a==="cfg"){var e0=exDe(t.dataset.id),v0=parseInt(t.value,10);if(e0&&!isNaN(v0)&&v0>=0){e0[t.dataset.f]=v0;salvar();aviso("Salvo")}}
  else if(t.dataset&&t.dataset.a==="renomear"){var e=S.ex.find(function(x){return x.id===t.dataset.id});if(e&&t.value.trim()){e.nome=t.value.trim();salvar();aviso("Nome salvo")}}
});
var rest=document.getElementById("rest"),fimMsg=0;
setInterval(function(){
  if(U.timer){var s=Math.ceil((U.timer.fim-Date.now())/1000);
    if(s<=0){U.timer=null;fimMsg=Date.now()+3000;bip();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}rest.hidden=false;rest.querySelector("span").textContent="Descanso acabou. Próxima série!";rest.querySelector("button").hidden=true;return}
    rest.hidden=false;rest.querySelector("button").hidden=false;
    rest.querySelector("span").textContent="Descanso "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" · "+U.timer.nome;
  }else if(Date.now()>fimMsg){rest.hidden=true}
},250);
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
})();
</script>
